[package]
name = "betterstore"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name="betterstore"
path="./src/lib.rs"

[[bin]]
name="server"
path="./src/bin/server.rs"

[[bin]]
name="client_test"
path="./src/bin/client_test.rs"

[dependencies]
actix = "0.13.6"
tokio = { version = "1.54", features = ["full"] }
tokio-stream = "0.1.19"
tonic = "0.14.9"
tonic-prost = "0.14.9"
prost = "0.14.6"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
# Stay on bincode 1.x: 2.x changes the encoding and would break existing chunk files.
bincode = "1.3.3"
chrono = "0.4.45"
rand = "0.10.4"
ring = "0.17.14"
log = "0.4.35"
env_logger = "0.11.11"

[build-dependencies]
tonic-prost-build = "0.14.9"
